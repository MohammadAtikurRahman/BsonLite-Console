name: Test and build Windows Console

on:
  push:
    branches: [main, fix/console-installer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build:win
      - run: npm run test:installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BsonLite-Console-Windows-x64
          path: release/BsonLite-Console-Setup-*-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: BsonLite-Console-UI-checks
          path: test-output/
          if-no-files-found: ignore
          retention-days: 14
